<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- French flag stripe effect -->
  <rect x="0" y="580" width="400" height="50" fill="#002395"/>
  <rect x="400" y="580" width="400" height="50" fill="#FFFFFF"/>
  <rect x="800" y="580" width="400" height="50" fill="#ED2939"/>

  <!-- Main content -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Objectif Citoyen
  </text>

  <text x="600" y="300" font-family="Arial, sans-serif" font-size="42" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Préparez l'Examen Civique 2026
  </text>

  <text x="600" y="400" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    125 questions | 5 thèmes officiels | 100% gratuit
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="120" r="40" fill="rgba(255,255,255,0.1)"/>
</svg>
